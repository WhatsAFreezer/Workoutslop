# Tester appen og bygger Windows-programmet (.exe) på en rigtig Windows-maskine hos GitHub.
# Det færdige program kan hentes under fanen "Actions" -> den seneste kørsel -> "Artifacts".
# Pusher du et tag som v0.2.0, bliver programmet også lagt op som en "Release".
name: Byg Workoutslop

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Workoutslop-Windows
          path: dist/*.exe
          if-no-files-found: error
      - name: Læg programmet op som release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
